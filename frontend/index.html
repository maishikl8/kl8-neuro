<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KL8 Neuro - 智能预测</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0a0a0a;color:#fff;margin:0;padding:20px;min-height:100vh}
.container{max-width:500px;margin:0 auto}
h1{font-size:28px;text-align:center;margin:30px 0 10px;background:linear-gradient(90deg,#00f5ff,#ff00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;color:#888;margin-bottom:30px;font-size:14px}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;padding:20px;margin-bottom:16px}
.status{display:flex;align-items:center;gap:8px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:#666}
.dot.live{background:#00ff88;box-shadow:0 0 8px #00ff88}
input{width:100%;background:#222;border:1px solid #333;border-radius:12px;padding:14px;color:#fff;box-sizing:border-box;margin:8px 0;font-size:16px}
button{width:100%;background:#fff;color:#000;border:none;border-radius:12px;padding:16px;font-weight:700;font-size:16px;cursor:pointer;margin-top:12px}
button:active{transform:scale(0.98)}
.result{margin-top:20px;padding:16px;background:#111;border-radius:12px;font-family:monospace;white-space:pre-wrap;display:none}
</style>
</head>
<body>
<div class="container">
  <h1>KL8 NEURO</h1>
  <div class="subtitle">AI驱动的智能分析</div>
  
  <div class="card">
    <div class="status">
      <div id="dot" class="dot"></div>
      <span id="statusText">正在连接后端...</span>
    </div>
  </div>

  <div class="card">
    <label style="font-size:13px;color:#888">输入历史开奖 (用逗号分隔)</label>
    <input id="history" placeholder="例如: 12, 45, 67, 23, 89..." />
    <button onclick="predict()">开始分析</button>
    <div id="result" class="result"></div>
  </div>
</div>

<script>
const API = 'https://kl8-neuro.onrender.com';
async function checkBackend(){
  try{
    const r = await fetch(API + '/');
    const j = await r.json();
    document.getElementById('dot').classList.add('live');
    document.getElementById('statusText').textContent = '后端已连接 - ' + j.message;
  }catch(e){
    document.getElementById('statusText').textContent = '后端连接失败，请等待Render唤醒(30秒)';
  }
}
function predict(){
  const v = document.getElementById('history').value;
  if(!v){alert('请输入历史数据');return;}
  const res = document.getElementById('result');
  res.style.display='block';
  res.textContent = '分析中...\n\n基于 ' + v.split(',').length + ' 期数据\n神经网络计算中...\n\n预测结果 (模拟):\n' + Array.from({length:10},()=>Math.floor(Math.random()*80)+1).join(', ');
}
checkBackend();
setInterval(checkBackend, 30000);
</script>
</body>
</html>
