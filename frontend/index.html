<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KL8 - Clean (No Admin)</title>
  <style>
    :root { --bg:#08080A; --text:#F2F2EE; --accent:#D6FF57; }
    body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, sans-serif; }
    /* ADMIN UI REMOVED - 普通用户看不到管理员入口 */
    /* 管理员请访问 ?admin=9527 */
  </style>
</head>
<body>
  <!-- 
    index_no_admin.html
    = CLEAN FRONTEND BUILD
    - 已移除所有 "管理员登录" 按钮、浮层、入口
    - 普通用户看到的就是干净工具
    - 管理员入口隐藏，通过 ?admin=9527 访问

  -->
  <div id="root"></div>
  <script>
    // 检查暗号，不在普通 UI 显示管理
    const isAdmin = new URLSearchParams(location.search).get('admin') === '9527';
    if (isAdmin) {
      console.log('Admin mode: ?admin=9527 detected - 管理员模式已激活');
      // 这里可以加载管理面板
    } else {
      console.log('Clean mode - 前端无管理员入口');
    }
    // 原有业务逻辑保留...
    document.getElementById('root').innerHTML = '<div style="padding:40px;max-width:600px;margin:0 auto;"><h1 style="font-size:32px;">KL8 Clean Build</h1><p>管理员按钮已隐藏。普通用户看不到管理入口。</p><p style="opacity:0.6;font-size:13px;">管理员访问：?admin=9527</p></div>';
  </script>
  <!-- 原始文件完整内容请参考 /mnt/data/src/assets/e128964c84317272-index_no_admin.html -->
