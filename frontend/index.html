<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<script>
// V4: 最高优先级，页面任何代码执行前就去云端拉67组
(async function(){
  const BACKEND = "https://kl8-neuro.onrender.com";
  const KEY = 'KL8_POOL_DATA';
  try{
    const r = await fetch(BACKEND + '/api/pool?t=' + Date.now(), {cache:'no-store', mode:'cors'});
    const d = await r.json();
    if(d && d.ok && d.pool && d.pool.length > 0){
      const cloudLen = d.pool.length;
      localStorage.setItem(KEY, JSON.stringify(d.pool));
      // 把云端数量写到全局变量，供后面渲染用
      window.__CLOUD_POOL__ = d.pool;
      window.__CLOUD_POOL_LEN__ = cloudLen;
      console.log('[V4] Cloud pool loaded:', cloudLen);
      // 立刻改掉页面上所有显示12组的文字
      const fixBadge = ()=> {
        document.querySelectorAll('*').forEach(el=>{
          if(el.childNodes.length===1 && el.textContent && el.textContent.trim()==='当前共  67  组 [云端同步版V4]'){
            el.textContent='当前共  '+cloudLen+'  组';
          }
          if(el.textContent && el.textContent.includes('当前共  67  组 [云端同步版V4]')){
            el.innerHTML = el.innerHTML.replace('当前共  67  组 [云端同步版V4]','当前共  '+cloudLen+'  组');
            el.textContent = el.textContent.replace('当前共  67  组 [云端同步版V4]','当前共  '+cloudLen+'  组');
          }
        });
      };
      fixBadge();
      setInterval(fixBadge, 500);
      document.addEventListener('DOMContentLoaded', fixBadge);
    }
  }catch(e){
    console.error('[V4] Cloud fetch failed', e);
  }
})();
</script>

const BACKEND = "https://kl8-neuro.onrender.com";

(function(){
  function patch(){
    // 找到所有按钮
    const btns = Array.from(document.querySelectorAll('button, div')).filter(el=> el.textContent && el.textContent.includes('我已支付'));
    if(btns.length===0){ setTimeout(patch, 1000); return; }

      btn.dataset.patched="1";
      btn.textContent = "已支付？粘贴交易哈希验证";
      btn.style.background="#00ff88";
      btn.onclick = async (e)=>{
        e.preventDefault();
        const txHash = prompt(`请粘贴你的USDT TRC20交易哈希 (TxHash)\n\n收款地址:\n${RECEIVE_ADDR}\n金额: 10 USDT\n\n在你的钱包交易记录里复制TxHash:`);
        if(!txHash) return;
        btn.textContent="正在链上验证...";
        btn.disabled=true;
        try{
          const res = await fetch(BACKEND + "/api/payment/verify", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({txHash: txHash.trim()})
          });
          const data = await res.json();
          if(data.ok){
            alert(`验证成功！\n授权码：${data.licenseKey}\n剩余：${data.remaining}次\n\n请务必保存授权码！第二天凭此码恢复次数！`);
            localStorage.setItem('KL8_LICENSE', data.licenseKey);
            localStorage.setItem('KL8_REMAINING', data.remaining);
            location.reload();
          } else {
            alert("验证失败：" + data.msg);
            btn.textContent="已支付？粘贴交易哈希验证";
            btn.disabled=false;
          }
        }catch(err){
          alert("验证出错：" + err.message);
          btn.textContent="已支付？粘贴交易哈希验证";
          btn.disabled=false;
        }
      };
    });

      const bar = document.createElement('div');

        document.getElementById('licenseBtn').onclick = async ()=>{
          const key = document.getElementById('licenseInput').value.trim();
          if(!key) return;
          const r = await fetch(BACKEND+"/api/license/check",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({licenseKey:key})});
          const d = await r.json();
          if(d.ok){
            alert(`授权码有效，剩余${d.remaining}次`);
            localStorage.setItem('KL8_LICENSE', key);
            localStorage.setItem('KL8_REMAINING', d.remaining);

      },500);
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', patch);

<script>
(function(){
  // 覆盖旧的初选池编辑器逻辑 - 无上限版本
  function initUnlimitedPoolEditor(){
    // 找到初选池批量管理的容器
    const check = setInterval(()=>{
      const btns = Array.from(document.querySelectorAll('button')).filter(b=>b.textContent.includes('打开编辑器'));
      if(btns.length===0) return;
      const openBtn = btns[0];
      if(openBtn.dataset.fixed) return;
      openBtn.dataset.fixed='1';
      
      openBtn.onclick = function(){
        // 创建全屏编辑器
        document.getElementById('kl8-pool-editor')?.remove();
        const currentData = (() => {
          try {
            const stored = localStorage.getItem('KL8_POOL_DATA');
            if(stored) return JSON.parse(stored);
          } catch(e){}
          // 默认12组
          return [[5,12,23,34,45,56,67,78],[2,14,26,33,48,59,61,73],[8,19,27,36,44,52,66,80],[11,22,31,40,50,63,72,77],[4,17,28,39,47,58,69,74],[1,15,24,35,46,55,68,79],[6,18,29,37,43,54,62,71],[9,20,32,41,49,60,65,75],[3,13,25,38,42,53,64,70],[10,16,30,46,51,57,76,80],[7,21,33,44,48,59,66,73],[12,24,35,46,57,68,79,80]];
        })();
        
        const editor = document.createElement('div');
        editor.id='kl8-pool-editor';
        editor.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:9999999;padding:16px;display:flex;flex-direction:column;';
        const textValue = currentData.map(row=>row.join(', ')).join('\n');
        editor.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <b style="color:#fff;font-size:16px;">初选池编辑 - 无上限 (当前 ${currentData.length} 组)</b>
            <button id="kl8-close-editor" style="background:#1e3a5f;border:none;border-radius:8px;padding:8px 14px;color:#fff;">✕ 关闭</button>
          </div>
          <div style="color:#8aa0c0;font-size:12px;margin-bottom:8px;">每行8个号码，空格或逗号分隔，支持1000+组。粘贴后点保存。</div>
          <textarea id="kl8-pool-textarea" style="flex:1;background:#0a1429;border:1px solid #1e4a5f;border-radius:12px;padding:12px;color:#4fc3f7;font-family:monospace;font-size:13px;resize:none;">${textValue}</textarea>
          <div style="display:flex;gap:8px;margin-top:12px;">
            <button id="kl8-save-pool" style="flex:1;background:#00e676;border:none;border-radius:10px;padding:14px;font-weight:bold;font-size:15px;color:#000;">保存 - 共 <span id="kl8-count">${currentData.length}</span> 组</button>
            <button id="kl8-clear-pool" style="background:#ff1744;border:none;border-radius:10px;padding:14px;color:#fff;">清空</button>
          </div>
        `;
        document.body.appendChild(editor);
        
        const ta = document.getElementById('kl8-pool-textarea');
        const countSpan = document.getElementById('kl8-count');
        const updateCount = ()=>{
          const lines = ta.value.split('\n').filter(l=>l.trim().length>0);
          let valid=0;
          lines.forEach(l=>{
            const nums = l.split(/[\s,，]+/).filter(x=>x).map(x=>parseInt(x)).filter(n=>!isNaN(n));
            if(nums.length>=8) valid++;
          });
          countSpan.textContent=valid;
        };
        ta.addEventListener('input', updateCount);
        
        document.getElementById('kl8-close-editor').onclick = ()=>editor.remove();
        document.getElementById('kl8-clear-pool').onclick = ()=>{ if(confirm('清空全部？')){ ta.value=''; updateCount(); } };
        document.getElementById('kl8-save-pool').onclick = ()=>{
          const lines = ta.value.split('\n').filter(l=>l.trim().length>0);
          const pool=[];
          let errors=[];
          lines.forEach((line, idx)=>{
            const nums = line.split(/[\s,，]+/).filter(x=>x).map(x=>parseInt(x)).filter(n=>!isNaN(n));
            if(nums.length<8){ errors.push('第'+(idx+1)+'行不足8个'); return; }
            if(nums.length>8) nums.splice(8);
            pool.push(nums);
          });
          if(errors.length>0 && pool.length===0){ alert('格式错误:\n'+errors.join('\n')); return; }
          localStorage.setItem('KL8_POOL_DATA', JSON.stringify(pool));
          // 同时触发全局更新
          try { window.dispatchEvent(new CustomEvent('kl8-pool-updated', {detail:pool})); } catch(e){}
          alert('已保存 '+pool.length+' 组！刷新后生效。');
          editor.remove();
          location.reload();
        };
      };
      
      // 清空按钮
      const clearBtn = Array.from(document.querySelectorAll('button')).find(b=>b.textContent.includes('清空全部'));
      if(clearBtn && !clearBtn.dataset.fixed){
        clearBtn.dataset.fixed='1';
        clearBtn.onclick = ()=>{ if(confirm('确定清空初选池全部数据？')){ localStorage.removeItem('KL8_POOL_DATA'); location.reload(); } };
      }
    }, 800);
  }
  initUnlimitedPoolEditor();
})();
</script>

<script>
(function(){
  const BACKEND = "https://kl8-neuro.onrender.com";
  // 1. 前端启动时，从后端拉最新初选池
  async function loadPoolFromBackend(){
    try{
      const r = await fetch(BACKEND+'/api/pool', {cache:'no-store'});
      if(!r.ok) throw new Error('no pool api');
      const data = await r.json();
      if(data && data.pool && Array.isArray(data.pool) && data.pool.length>0){
        localStorage.setItem('KL8_POOL_DATA', JSON.stringify(data.pool));
        console.log('[KL8] Pool synced from backend:', data.pool.length);
        // 通知更新
        try { window.dispatchEvent(new CustomEvent('kl8-pool-updated', {detail:data.pool})); } catch(e){}
        return data.pool;
      }
    }catch(e){
      console.log('[KL8] Backend pool not available, use local:', e.message);
    }
    return null;
  }
  // 立即尝试
  loadPoolFromBackend();
  // 每30秒同步一次
  setInterval(loadPoolFromBackend, 30000);
  document.addEventListener('DOMContentLoaded', loadPoolFromBackend);

  // 2. 覆盖管理员保存逻辑：同时保存到后端
  const origSaveInterval = setInterval(()=>{
    const saveBtn = document.getElementById('kl8-save-pool');
    if(!saveBtn || saveBtn.dataset.backend) return;
    saveBtn.dataset.backend='1';
    const origOnClick = saveBtn.onclick;
    saveBtn.onclick = async function(){
      const ta = document.getElementById('kl8-pool-textarea');
      if(!ta) return;
      const lines = ta.value.split('\n').filter(l=>l.trim().length>0);
      const pool=[];
      lines.forEach(line=>{
        const nums = line.split(/[\s,，]+/).filter(x=>x).map(x=>parseInt(x)).filter(n=>!isNaN(n));
        if(nums.length>=8){ if(nums.length>8) nums.splice(8); pool.push(nums); }
      });
      if(pool.length===0){ alert('没有有效数据'); return; }
      
      // 先存本地
      localStorage.setItem('KL8_POOL_DATA', JSON.stringify(pool));
      
      // 再存后端
      saveBtn.innerText='同步到云端...'; saveBtn.disabled=true;
      try{
        const r = await fetch(BACKEND+'/api/pool/save', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({pool: pool, adminKey: localStorage.getItem('KL8_ADMIN_KEY') || 'admin9527'})
        });
        const d = await r.json();
        if(d.ok){
          alert('已同步到云端！共 '+pool.length+' 组，所有用户前端会自动更新。');
          document.getElementById('kl8-pool-editor')?.remove();
          location.reload();
        }else{
          alert('本地已保存，但云端同步失败：'+(d.msg||'未知')+'\n\n请去Render更新后端代码（我已给你后端补丁）。');
          document.getElementById('kl8-pool-editor')?.remove();
          location.reload();
        }
      }catch(e){
        alert('本地已保存，云端同步出错：'+e.message+'\n\n请更新后端。');
        document.getElementById('kl8-pool-editor')?.remove();
        location.reload();
      }
    };
  }, 1000);
})();
</script>

<script>
(function(){
  const BACKEND = "https://kl8-neuro.onrender.com";
  async function forceSyncPool(){
    try{
      const r = await fetch(BACKEND+'/api/pool', {cache:'no-store'});
      if(!r.ok) return;
      const data = await r.json();
      if(!data.ok || !data.pool) return;
      const newPool = data.pool;
      const oldStr = localStorage.getItem('KL8_POOL_DATA');
      let oldLen = 0;
      try{ oldLen = JSON.parse(oldStr||'[]').length; }catch(e){}
      if(newPool.length !== oldLen || oldLen===0){
        localStorage.setItem('KL8_POOL_DATA', JSON.stringify(newPool));
        console.log('[FORCE SYNC] Pool updated from backend:', newPool.length, 'was', oldLen);
        // 更新页面上所有显示组数的badge
        document.querySelectorAll('*').forEach(el=>{
          if(el.textContent && el.textContent.includes('当前共') && el.textContent.includes('组')){
            el.textContent = el.textContent.replace(/\d+\s*组/, newPool.length+' 组');
          }
        });
        // 如果页面已经渲染了12组，强制刷新一次
        if(oldLen !== newPool.length){
          setTimeout(()=>{ location.reload(); }, 800);
        }
      }
    }catch(e){ console.log('forceSync error', e.message); }
  }
  // 立即执行 + 每5秒检查一次，直到同步成功
  forceSyncPool();
  setInterval(forceSyncPool, 5000);
  window.addEventListener('load', forceSyncPool);
})();
</script>
